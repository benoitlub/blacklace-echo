<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Blacklace — Test suivi du visage</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#08121e;color:#fff}*{box-sizing:border-box}
body{margin:0}header{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;font-size:13px;background:#0c1626}
#scene{position:relative;width:100%;height:min(74dvh,780px);min-height:390px;overflow:hidden;background:#edac9b;touch-action:pan-y;isolation:isolate}
.layer{position:absolute;inset:-7% -13%;background-repeat:no-repeat;background-position:center center;background-size:cover;pointer-events:none;will-change:transform}
#status{font-size:13px;min-height:2em;color:#b9d8e8}main{padding:12px 14px;display:grid;gap:12px}
.controls{display:flex;gap:8px;flex-wrap:wrap}button{border:1px solid #7ca7c6;border-radius:12px;background:#17344c;color:white;padding:12px 15px;font:inherit}
button[aria-pressed=true]{background:#146b6a;border-color:#7df7d8}
label{display:flex;align-items:center;gap:12px}input{flex:1}
small{color:#9db5c6}#scene:after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 40px #07121c4d}
</style></head><body>
<header><strong>BLACKLACE · PORT 2,5D</strong><span>Test privé · caméra locale</span></header>
<div id="scene" aria-label="Vue expérimentale du port de Blacklace Island"></div>
<main><div class="controls"><button id="face" aria-pressed="false">◎ Activer visage</button><button id="center">Recentrer</button><button id="stop">Arrêter</button></div>
<label>Amplitude <input id="amplitude" type="range" min="0" max="100" value="75"><output id="value">75 %</output></label>
<div id="status" role="status">Glisse le doigt pour tester. Active la caméra pour le suivi facial.</div>
<small>Le suivi facial fonctionne uniquement après autorisation de la caméra, sur HTTPS. Traitement local dans le navigateur. Aucun enregistrement vidéo.</small></main>
<script type="module">
const scene=document.querySelector('#scene'),status=document.querySelector('#status');
const layers=[
['01_ciel.png',0,0],['02_volcan.png',.07,1],['03_foret.png',.15,2],['04_feuch_institut.png',.30,3],
['05_sator_clairiere.png',.38,4],['06_village.png',.50,5],['07_porsa_rotas.png',.65,6],
['08a_eau_reflets.png',.72,7],['08b_eau_vagues.png',.78,8],['08c_eau_ecume.png',.85,9],['09_quai.png',1,10]
].map(([name,depth,z])=>{const e=document.createElement('div');e.className='layer';e.style.backgroundImage='url("../../assets/blacklace/'+name+'")';e.style.zIndex=z;scene.append(e);return{e,depth}});
let x=0,y=0,tx=0,ty=0,amp=.75,active=false,stream=null,video=null,landmarker=null,frame=0,faceFrame=0,neutral=null,last=0,drag=null,session=0;
const clamp=(n,a,b)=>Math.min(b,Math.max(a,n));
function render(){x+=(tx-x)*.16;y+=(ty-y)*.16;for(const {e,depth} of layers){const d=depth*amp;e.style.transform='translate3d('+(-x*d*36).toFixed(2)+'px,'+(-y*d*22).toFixed(2)+'px,0) scale('+(1.06+d*.11)+')'}frame=requestAnimationFrame(render)}
render();
document.querySelector('#amplitude').addEventListener('input',e=>{amp=Number(e.target.value)/100;document.querySelector('#value').textContent=e.target.value+' %'});
document.querySelector('#center').onclick=()=>{neutral=null;tx=0;ty=0;status.textContent=active?'Recentrage : regarde au centre de l’écran.':'Perspective recentrée.'};
scene.addEventListener('pointerdown',e=>{if(active)return;drag={x:e.clientX,y:e.clientY,tx,ty};scene.setPointerCapture(e.pointerId)});
scene.addEventListener('pointermove',e=>{if(!drag||active)return;tx=clamp(drag.tx+(e.clientX-drag.x)/90,-1,1);ty=clamp(drag.ty+(e.clientY-drag.y)/90,-1,1)});
scene.addEventListener('pointerup',()=>drag=null);
scene.addEventListener('pointercancel',()=>drag=null);
const faceButton=document.querySelector('#face');
function stop(){session++;active=false;cancelAnimationFrame(faceFrame);stream?.getTracks().forEach(t=>t.stop());stream=null;if(video){video.srcObject=null;video.remove()}video=null;neutral=null;landmarker?.close?.();landmarker=null;faceButton.textContent='◎ Activer visage';faceButton.setAttribute('aria-pressed','false');tx=0;ty=0}
document.querySelector('#stop').onclick=()=>{stop();status.textContent='Caméra arrêtée. Mode tactile disponible.'};
faceButton.onclick=async()=>{
 if(active){stop();status.textContent='Suivi arrêté.';return}
 faceButton.disabled=true;
 const thisSession=session;
 const timed=(promise,seconds,step)=>Promise.race([promise,new Promise((_,reject)=>setTimeout(()=>reject(new Error(step+' : délai dépassé ('+seconds+' s).')),seconds*1000))]);
 try{
  if(!window.isSecureContext)throw new Error('Cette page doit être ouverte via HTTPS.');
  if(!navigator.mediaDevices?.getUserMedia)throw new Error('API caméra indisponible dans ce navigateur');
  status.textContent='Caméra 1/2 : vérification des permissions…';
  try{
   const permission=await timed(navigator.permissions.query({name:'camera'}),3,'Vérification permission');
   if(permission.state==='denied')throw new Error('Caméra bloquée dans les permissions du site : autorise-la dans les paramètres du navigateur');
   status.textContent=permission.state==='prompt'?'Caméra 1/2 : accepte la demande du navigateur…':'Caméra 1/2 : ouverture du flux vidéo…';
  }catch(e){if(e.message.includes('Caméra bloquée'))throw e;status.textContent='Caméra 1/2 : ouverture du flux vidéo…'}
  const request=navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:'user',width:{ideal:320},height:{ideal:240}}});
  request.then(s=>{if(thisSession!==session)s.getTracks().forEach(t=>t.stop())}).catch(()=>{});
  stream=await timed(request,12,'Ouverture caméra (permission ou appareil occupé)');
  if(thisSession!==session)throw new Error('Demande annulée');
  status.textContent='Caméra 2/2 : démarrage vidéo…';
  video=document.createElement('video');video.muted=true;video.autoplay=true;video.playsInline=true;video.srcObject=stream;
  // On mobile, video.play() can remain pending; bound it separately from permission.
  await timed(video.play(),8,'Démarrage vidéo');
  if(thisSession!==session)throw new Error('Demande annulée');
  status.textContent='MediaPipe 1/3 : téléchargement du module…';
  // The published ESM bundle is a more predictable browser entry point than +esm rewriting.
  const vendorBase=new URL('../../vendor/mediapipe/',window.location.href).href;
  const mp=await timed(import(/* @vite-ignore */ vendorBase+'vision_bundle.mjs'),18,'Module MediaPipe');
  if(thisSession!==session)throw new Error('Chargement annulé');
  status.textContent='MediaPipe 2/3 : chargement WASM…';
  const files=await timed(mp.FilesetResolver.forVisionTasks(vendorBase+'wasm'),18,'Moteur WASM');
  if(thisSession!==session)throw new Error('Chargement annulé');
  status.textContent='MediaPipe 3/3 : chargement du modèle facial…';
  const model=await timed(fetch('https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task').then(async response=>{if(!response.ok)throw new Error('Modèle facial HTTP '+response.status);return new Uint8Array(await response.arrayBuffer())}),25,'Modèle facial');
  if(thisSession!==session)throw new Error('Chargement annulé');
  const created=await timed(mp.FaceLandmarker.createFromOptions(files,{baseOptions:{modelAssetBuffer:model,delegate:'CPU'},runningMode:'VIDEO',numFaces:1}),25,'Initialisation du détecteur');
  if(thisSession!==session){created.close();throw new Error('Chargement annulé')}
  landmarker=created;
  active=true;neutral=null;last=0;faceButton.setAttribute('aria-pressed','true');faceButton.textContent='◎ Visage actif';status.textContent='Suivi actif. Bouge doucement la tête.';
  const detect=now=>{if(!active)return;if(now-last>100&&video.readyState>=2){last=now;try{const face=landmarker.detectForVideo(video,now).faceLandmarks?.[0];if(face){const p=face[1]||face[4]||face[0];if(!neutral)neutral={x:p.x,y:p.y};tx=clamp((neutral.x-p.x)*5,-1,1);ty=clamp((neutral.y-p.y)*5,-1,1)}else status.textContent='Visage hors champ : replace-toi face à l’écran.'}catch(e){status.textContent='Erreur de détection : '+e.message}}faceFrame=requestAnimationFrame(detect)};
  faceFrame=requestAnimationFrame(detect);
 }catch(e){stop();status.textContent='Diagnostic : '+(e.name==='NotAllowedError'?'permission caméra refusée (vérifie les autorisations du site)':e.name==='NotReadableError'?'caméra occupée ou inaccessible':e.message)+' — le tactile reste disponible.'}
 finally{faceButton.disabled=false}
};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&active)stop()});
window.addEventListener('pagehide',stop);
</script></body></html>

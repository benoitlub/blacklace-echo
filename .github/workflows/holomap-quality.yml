name: HoloMap quality gate
on:
  pull_request:
    paths:
      - "src/pages/Map.tsx"
      - "src/styles/rotas.css"
      - ".github/workflows/holomap-quality.yml"
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test -- --run
      - run: npm run build

name: Blacklace mobile browser check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm run build
      - name: Install isolated browser test dependencies
        run: |
          npm install --prefix /tmp/qa-playwright --ignore-scripts --no-audit --no-fund playwright
          npx --prefix /tmp/qa-playwright playwright install --with-deps chromium
      - name: Check the built site on a mobile viewport
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/qa-vite.log 2>&1 &
          node scripts/mobile-smoke.mjs || { cat /tmp/qa-vite.log; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-browser-check
          path: qa-output/
          if-no-files-found: ignore

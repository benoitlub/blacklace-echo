name: Sherlock World Core CI

on:
  pull_request:
    paths:
      - 'src/sherlock/**'
      - '.github/workflows/sherlock-ci.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test -- src/sherlock
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm run build

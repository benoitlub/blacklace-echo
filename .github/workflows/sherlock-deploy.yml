name: Deploy Sherlock Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/sherlock/**'
      - 'wrangler.sherlock.toml'
      - '.github/workflows/sherlock-deploy.yml'

permissions:
  contents: read

concurrency:
  group: sherlock-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test -- src/sherlock src/blacklace
      - run: npx tsc --noEmit -p tsconfig.app.json
      - name: Deploy existing Worker (do not run D1 migrations)
        run: npx --yes wrangler@4 deploy --config wrangler.sherlock.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Check deployed endpoint (configuration may still be incomplete)
        run: |
          curl --silent --show-error --output health.json --write-out '%{http_code}' https://blacklace-sherlock.benoitlubert.workers.dev/health > status.txt
          cat health.json
          grep -q '"service":"sherlock"' health.json
          grep -Eq '^(200|503)
 status.txt

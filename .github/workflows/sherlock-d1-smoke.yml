name: Verify Sherlock D1
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy Sherlock Worker"]
    types: [completed]
permissions:
  contents: read
jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Cycle the configured public Sherlock session
        env:
          TOKEN: ${{ secrets.SHERLOCK_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$TOKEN"
          session_id=19de2707-4ec2-4aa2-ac15-c5b5669549b3
          base=https://blacklace-sherlock.benoitlubert.workers.dev
          endpoint="$base/api/sherlock/sessions/$session_id"

          code=$(curl -sS -o before.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$endpoint")
          test "$code" = 200

          code=$(curl -sS -o cycle.json -w '%{http_code}' -X POST -H "Authorization: Bearer $TOKEN" "$endpoint/cycles")
          cat cycle.json
          test "$code" = 200

          code=$(curl -sS -o after.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$endpoint")
          test "$code" = 200
          jq -e --arg id "$session_id" '.sessionId == $id and (.decisions | any(.source == "octopus"))' after.json >/dev/null

          code=$(curl -sS -o feed.json -w '%{http_code}' "$base/api/sherlock/public-feed")
          test "$code" = 200
          cat feed.json
          jq -e '.entries | length > 0' feed.json >/dev/null
          echo "PASS: public Sherlock session cycled and feed contains an Octopus-backed event"

name = "blacklace-sherlock"
main = "src/sherlock/worker.ts"
compatibility_date = "2026-09-26"
workers_dev = true
keep_vars = true

# Runtime vars/secrets are managed in Cloudflare and survive deployments.
# Octopus is reached privately through a Cloudflare Service Binding.
[[services]]
binding = "OCTOPUS"
service = "octopus-engine-app"

[[d1_databases]]
binding = "SHERLOCK_DB"
database_name = "blacklace-sherlock"
database_id = "d8a9b5e5-23ce-4544-9013-a0c35f67b7bd"
migrations_dir = "src/sherlock/migrations"
